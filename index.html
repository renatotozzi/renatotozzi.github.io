<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>my-pfm</title>

  <meta name="description" content="Organize, planeje e acompanhe suas finanças pessoais.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1117" media="(prefers-color-scheme: dark)">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="my-pfm">

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      color-scheme: light dark;
      --shell-background: #FFFFFF;
      --brand-text: #0E1117;
      --slogan-text: #4B5563;
      --brand-lilac: #B778FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --shell-background: #0E1117;
        --brand-text: #F7F8FA;
        --slogan-text: #C9CBD2;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: var(--shell-background) !important;
    }

    .pwa-wrapper {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: var(--shell-background) !important;
    }

    #streamlit-app {
      position: fixed !important;
      top: calc(env(safe-area-inset-top, 0px) - 12px) !important;
      left: -10px !important;
      bottom: -65px !important;
      width: calc(100% + 20px) !important;
      height: auto !important;
      border: 0 !important;
      outline: none !important;
      box-shadow: none !important;
      opacity: 0;
      transition: opacity 320ms ease;
      -webkit-overflow-scrolling: touch;
    }
    
    #streamlit-app.is-ready {
      opacity: 1;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: var(--shell-background);
      opacity: 1;
      visibility: visible;
      transition: opacity 320ms ease, visibility 320ms ease;
    }

    .splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(-4vh);
    }

    .splash-mark {
      width: clamp(104px, 27vw, 144px);
      height: auto;
      display: block;
      margin-bottom: 18px;
    }

    .splash-name {
      margin: 0;
      color: var(--brand-text);
      font: 800 clamp(48px, 13vw, 68px)/0.95 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.055em;
    }

    .splash-name span {
      color: var(--brand-lilac);
    }

    .splash-slogan {
      margin: 18px 0 0;
      color: var(--slogan-text);
      font: 500 clamp(15px, 4vw, 19px)/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.01em;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 34px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-lilac);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 160ms; }
    .loading-dots span:nth-child(3) { animation-delay: 320ms; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.28; transform: scale(0.82); }
      40% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #streamlit-app, .splash { transition: none; }
      .loading-dots span { animation: none; opacity: 0.65; }
    }

    div[data-testid="stHtml"] iframe,
    div[data-testid="stCustomComponentV1"] {
      display: none !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .element-container:has(iframe) {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="pwa-wrapper">
    <iframe
      id="streamlit-app"
      title="my-pfm"
      src="https://my-pfm.streamlit.app?embed=true&amp;embed_options=show_toolbar"
      frameborder="0"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation allow-modals"
      allow="geolocation; camera; microphone"
    ></iframe>
  </div>

  <div id="splash" class="splash" role="status" aria-label="Carregando my-pfm">
    <div class="splash-brand">
      <img class="splash-mark" src="pig-mark.png" alt="">
      <p class="splash-name">my<span>-pfm</span></p>
      <p class="splash-slogan">Organize. Planeje. Conquiste.</p>
      <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('streamlit-app');
    const splash = document.getElementById('splash');
    const splashStartedAt = performance.now();
    let revealed = false;

    function revealApp() {
      if (revealed) return;
      revealed = true;

      const minimumVisibleTime = 1200;
      const streamlitPaintDelay = 2500;
      const elapsed = performance.now() - splashStartedAt;
      const wait = Math.max(0, minimumVisibleTime - elapsed) + streamlitPaintDelay;

      window.setTimeout(() => {
        iframe.classList.add('is-ready');
        splash.classList.add('is-hidden');
      }, wait);
    }

    iframe.addEventListener('load', revealApp, { once: true });
    window.setTimeout(revealApp, 15000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
