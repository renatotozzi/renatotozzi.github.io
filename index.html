<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>My PFM</title>
  
  <!-- Configurações Obrigatórias para iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My PFM">
  
  <!-- Ícone para iOS (Reutilizando seu arquivo de 512px) -->
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Link do Manifesto para Android/Chrome -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Zera o documento e impede qualquer rolagem da janela externa */
    body, html { 
      margin: 0 !important; 
      padding: 0 !important; 
      height: 100% !important; 
      width: 100% !important;
      overflow: hidden !important; 
      background-color: #000000; 
    }
    
    /* ENVELOPE MÁSCARA: Limita o tamanho à tela exata do dispositivo e esconde rebarbas */
    .pwa-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden !important;
    }
    
    /* IFRAME: Ajustado milimetricamente para sangrar as bordas para fora da tela */
    iframe { 
      position: absolute;
      
      /* Empurra o iframe 2px para cima e 2px para a esquerda */
      top: -2px !important;
      left: -2px !important;
      
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      
      /* Compensa o deslocamento nas laterais (+4px) e no topo/fundo (+54px) */
      width: calc(100% + 4px) !important; 
      height: calc(100% + 54px) !important; 
      
      -webkit-overflow-scrolling: touch; 
    }
    
    /* Limpeza de componentes internos do Streamlit */
    div[data-testid="stHtml"] iframe,
    div[data-testid="stCustomComponentV1"] {
      display: none !important;
      height: 0px !important;
      margin: 0px !important;
      padding: 0px !important;
    }
    
    .element-container:has(iframe) {
      display: none !important;
    }
  </style>
</head>
<body>
  
  <div class="pwa-wrapper">
    <iframe
      src="https://streamlit.app"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
      allow="geolocation; camera; microphone"
    ></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
