<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA Specific Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamlitPWA">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100vh; /* Use viewport height */
      width: 100vw;  /* Use viewport width */
      overflow: hidden; 
      background-color: #ffffff; 
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      min-height: 100vh; /* Prevent collapsing on iOS */
    }
  </style>
</head>
<body>
  <!-- Embed your Streamlit app. ?embed=true cleans up the UI -->
  <iframe src="https://my-pfm.streamlit.app?embed=true"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
