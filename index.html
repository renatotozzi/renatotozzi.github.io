<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>My PFM</title>
  
  <!-- Configurações Obrigatórias para iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My PFM">
  
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Zera a janela do PWA para preencher a tela inteira do celular */
    body, html { 
      margin: 0 !important; 
      padding: 0 !important; 
      height: 100% !important; 
      width: 100% !important;
      overflow: hidden !important; 
      background-color: #000000 !important; 
    }
    
    .pwa-wrapper {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
    
    /* Iframe limpo e justo na tela (sem precisar sangrar para esconder rodapé) */
    iframe { 
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      border: 0 !important;
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      width: 100% !important; 
      height: 100% !important; 
      -webkit-overflow-scrolling: touch; 
    }
  </style>
</head>
<body>
  
  <div class="pwa-wrapper">
    <iframe
      src="https://my-pfm.streamlit.app?embed=true&embed_options=show_toolbar"
      frameBorder="0"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
      allow="geolocation; camera; microphone"
    ></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
