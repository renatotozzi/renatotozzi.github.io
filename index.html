<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>My PFM</title>
  
  <!-- Configurações Obrigatórias para iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My PFM">
  
  <!-- Ícone para iOS (Reutilizando seu arquivo de 512px) -->
  <!-- O iOS vai auto-ajustar o tamanho e aplicar os cantos arredondados nativos -->
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Link do Manifesto para Android/Chrome -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000000; 
    }
    
    /* TRUQUE PARA ESCONDER O RODAPÉ DO STREAMLIT */
    iframe { 
      border: none !important; /* Remove qualquer borda visível padrão */
      outline: none !important;
      width: 100%; 
      
      /* Faz o iframe ser um pouquinho mais alto que a tela do celular */
      height: calc(100% + 40px) !important; 
      
      /* Empurra o rodapé para baixo, sumindo com o 'Built with Streamlit' */
      margin-bottom: -40px !important; 
      
      -webkit-overflow-scrolling: touch; 
    }
    
    div[data-testid="stHtml"] iframe,
    div[data-testid="stCustomComponentV1"] {
      display: none !important;
      height: 0px !important;
      margin: 0px !important;
      padding: 0px !important;
    }
    
    .element-container:has(iframe) {
      display: none !important;
    }
  </style>
</head>
<body>
  
  <iframe
    src="https://my-pfm.streamlit.app?embed=true"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
    allow="geolocation; camera; microphone"
  ></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
