<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>My PFM</title>
  
  <!-- Configurações Obrigatórias para iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My PFM">
  
  <!-- Ícone para iOS (Reutilizando seu arquivo de 512px) -->
  <!-- O iOS vai auto-ajustar o tamanho e aplicar os cantos arredondados nativos -->
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Link do Manifesto para Android/Chrome -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000000; /* Evita flashes brancos no fundo do iOS antes do app carregar */
    }
    iframe { 
      border: none; 
      width: 100%; 
      height: 100%; 
      /* Correção para rolagem suave no Safari do iOS */
      -webkit-overflow-scrolling: touch; 
    }
  </style>
</head>
<body>
  
  <iframe
    src="https://my-pfm.streamlit.app?embed=true"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
    allow="geolocation; camera; microphone"
  ></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
