<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>My PFM</title>
  
  <!-- Configurações Obrigatórias para iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My PFM">
  
  <!-- Ícone para iOS (Reutilizando seu arquivo de 512px) -->
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Link do Manifesto para Android/Chrome -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Garante tela cheia absoluta preta no app shell */
    body, html { 
      margin: 0 !important; 
      padding: 0 !important; 
      height: 100% !important; 
      width: 100% !important;
      overflow: hidden !important; 
      background-color: #000000 !important; 
    }
    
    /* ENVELOPE MÁSCARA: Corta qualquer rebarba ou pixel que passe da tela do celular */
    .pwa-wrapper {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background-color: #000000 !important;
    }
    
    /* SANGRAMENTO AGRESSIVO: Força o iframe a expandir 10px para fora em todas as direções */
    iframe { 
      position: absolute !important;
      
      /* Joga o início do frame para fora da área visível */
      top: -10px !important;
      left: -10px !important;
      
      /* Remove contornos e sombras padrões de navegadores */
      border: 0 !important;
      border: none !important; 
      outline: none !important;
      box-shadow: none !important;
      
      /* Compensa os 10px perdidos de cada lado expandindo o tamanho total */
      width: calc(100% + 20px) !important; 
      height: calc(100% + 65px) !important; /* Ganho maior na base para continuar sumindo com o rodapé */
      
      -webkit-overflow-scrolling: touch; 
    }
    
    /* Bloqueio de detritos visuais do Streamlit */
    div[data-testid="stHtml"] iframe,
    div[data-testid="stCustomComponentV1"] {
      display: none !important;
      height: 0px !important;
      margin: 0px !important;
      padding: 0px !important;
    }
    
    .element-container:has(iframe) {
      display: none !important;
    }
  </style>
</head>
<body>
  
  <div class="pwa-wrapper">
    <!-- Incluído o frameBorder="0" direto na tag para garantir compatibilidade com o Safari iOS -->
    <iframe
      src="https://my-pfm.streamlit.app?embed=true"
      frameBorder="0"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation"
      allow="geolocation; camera; microphone"
    ></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
